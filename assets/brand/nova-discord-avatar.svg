<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Discord avatar: full-bleed (Discord crops to a circle itself).
       Brand colours from nova-icon.svg; white sparkles so the mark reads at 32 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B6BFA"/>
      <stop offset="0.5" stop-color="#6D4AF0"/>
      <stop offset="1" stop-color="#0B8FB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="480" cy="544" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="512" cy="512" r="724" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#0A0620" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0620" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1E0B5C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>
  <circle cx="480" cy="544" r="420" fill="url(#glow)"/>

  <!-- main sparkle -->
  <path filter="url(#shadow)" fill="#FFFFFF"
        d="M480 236 Q522 502 788 544 Q522 586 480 852 Q438 586 172 544 Q438 502 480 236 Z"/>
  <!-- companion sparkle (the "nova" detail, same as the app icon) -->
  <path fill="#FFFFFF" fill-opacity="0.92"
        d="M768 206 Q779 273 846 284 Q779 295 768 362 Q757 295 690 284 Q757 273 768 206 Z"/>
</svg>
