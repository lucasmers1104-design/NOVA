// NOVA Companion's own Android module: notification access, calls, app updates.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.nova.bridge'
version = '1.2.0'

android {
  namespace "dev.nova.bridge"
  defaultConfig {
    versionCode 3
    versionName "1.2.0"
  }
}
